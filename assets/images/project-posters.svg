<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="100%" height="100%" fill="#F4F0E8"/>
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#0A0A0A" stroke-width="2"/>
  
  <!-- Screentone Dot Matrix Pattern -->
  <defs>
    <pattern id="posterDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#0A0A0A" opacity="0.35"/>
    </pattern>
  </defs>
  <rect x="26" y="26" width="748" height="448" fill="url(#posterDots)"/>

  <!-- Left: Stylized Poster Plaque -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="260" height="380" fill="#0A0A0A" stroke="#B51220" stroke-width="2.5"/>
    <!-- Inked Monolith Form -->
    <path d="M40,340 L130,40 L220,340 Z" fill="#F4F0E8"/>
    <circle cx="130" cy="180" r="30" fill="#B51220"/>
    
    <text x="130" y="310" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0A0A0A" text-anchor="middle">HORROR</text>
    <text x="130" y="360" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F4F0E8" letter-spacing="3" text-anchor="middle">EXHIBITION 2026</text>
  </g>

  <!-- Right: Editorial Meta & Title -->
  <g transform="translate(380, 130)">
    <rect x="0" y="0" width="130" height="24" fill="#0A0A0A"/>
    <text x="65" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F4F0E8" letter-spacing="1.5" text-anchor="middle">POSTER DESIGN</text>
    
    <text x="0" y="70" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#0A0A0A">Psychological</text>
    <text x="0" y="110" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#B51220">Cinema Series</text>
    
    <text x="0" y="160" font-family="sans-serif" font-size="14" fill="#333333">Screenprint Duotone &bull; Dense Line Inking &bull; Heavy Sans</text>
    <text x="0" y="210" font-family="'JetBrains Mono', monospace" font-size="12" fill="#666666">ARCHIVE: #POSTER-EX-04</text>
  </g>
</svg>
