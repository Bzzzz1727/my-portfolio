<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="editBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161d"/>
      <stop offset="100%" stop-color="#0f1015"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#editBg)"/>
  
  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="452" rx="4" fill="none" stroke="#2a2e3a" stroke-width="1.5"/>

  <!-- NLE Timeline UI Illustration -->
  <g transform="translate(60, 60)">
    <!-- Source / Program Monitor Split -->
    <rect x="0" y="0" width="320" height="180" rx="3" fill="#1b1e28" stroke="#2e3342"/>
    <text x="160" y="95" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6f7587" text-anchor="middle">SOURCE [RAW LOG]</text>
    
    <rect x="360" y="0" width="320" height="180" rx="3" fill="#1b1e28" stroke="#2e3342"/>
    <text x="520" y="95" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981" text-anchor="middle">PROGRAM [REC 709 COLOR]</text>

    <!-- Playhead Marker -->
    <line x1="390" y1="210" x2="390" y2="380" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="384,204 396,204 390,212" fill="#f59e0b"/>

    <!-- Multitrack Timeline Tracks -->
    <g transform="translate(0, 220)">
      <!-- V2 Track -->
      <rect x="0" y="0" width="680" height="28" rx="2" fill="#161822"/>
      <rect x="80" y="2" width="140" height="24" rx="2" fill="#3b4258" stroke="#48516d"/>
      <rect x="240" y="2" width="180" height="24" rx="2" fill="#3b4258" stroke="#48516d"/>
      <rect x="440" y="2" width="120" height="24" rx="2" fill="#3b4258" stroke="#48516d"/>

      <!-- V1 Track -->
      <rect x="0" y="34" width="680" height="28" rx="2" fill="#161822"/>
      <rect x="20" y="36" width="200" height="24" rx="2" fill="#4a5568" stroke="#5a687f"/>
      <rect x="225" y="36" width="160" height="24" rx="2" fill="#4a5568" stroke="#5a687f"/>
      <rect x="390" y="36" width="260" height="24" rx="2" fill="#4a5568" stroke="#5a687f"/>

      <!-- A1 Audio Track with Waveform simulation -->
      <rect x="0" y="68" width="680" height="28" rx="2" fill="#161822"/>
      <rect x="20" y="70" width="365" height="24" rx="2" fill="#2d4a43" stroke="#376156"/>
      <rect x="390" y="70" width="260" height="24" rx="2" fill="#2d4a43" stroke="#376156"/>

      <!-- Track Labels -->
      <text x="-10" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6f7587" text-anchor="end">V2</text>
      <text x="-10" y="54" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6f7587" text-anchor="end">V1</text>
      <text x="-10" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6f7587" text-anchor="end">A1</text>
    </g>

    <!-- Meta Title -->
    <g transform="translate(0, 345)">
      <text x="0" y="16" font-family="Georgia, serif" font-size="20" fill="#f4f5f8">Commercial &amp; Narrative Video Edit</text>
      <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8f9d">Replace with: assets/images/project-video-editing.jpg</text>
    </g>
  </g>
</svg>
