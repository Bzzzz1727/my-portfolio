<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="vinylGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/>
  <!-- Manga Screentone Frame -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#262626" stroke-width="2"/>
  
  <!-- Album Cover Jacket (Square 340x340) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="340" height="340" fill="#141414" stroke="#F4F0E8" stroke-width="2"/>
    <!-- Concentric Grooves -->
    <circle cx="170" cy="170" r="140" fill="none" stroke="#282828" stroke-width="1.5"/>
    <circle cx="170" cy="170" r="110" fill="none" stroke="#282828" stroke-width="1.5"/>
    <circle cx="170" cy="170" r="80" fill="none" stroke="#282828" stroke-width="1.5"/>
    <!-- Center Label (Blood Red Accent) -->
    <circle cx="170" cy="170" r="48" fill="#B51220" stroke="#F4F0E8" stroke-width="2"/>
    <circle cx="170" cy="170" r="8" fill="#0A0A0A"/>
    
    <!-- Heavy Cross-Hatched Surreal Shadow -->
    <path d="M0,0 L340,340 L340,0 Z" fill="#F4F0E8" opacity="0.08"/>
    <text x="170" y="310" font-family="'Courier New', monospace" font-size="11" fill="#F4F0E8" letter-spacing="4" text-anchor="middle">ECHOS OF THE VOID // 33 RPM</text>
  </g>

  <!-- Side Typography & Meta -->
  <g transform="translate(460, 140)">
    <rect x="0" y="0" width="110" height="24" fill="#B51220"/>
    <text x="55" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F4F0E8" letter-spacing="1.5" text-anchor="middle">ALBUM ART</text>
    
    <text x="0" y="75" font-family="Georgia, serif" font-size="32" font-weight="500" fill="#F4F0E8">Subterranean</text>
    <text x="0" y="112" font-family="Georgia, serif" font-size="32" font-weight="500" fill="#B51220">Sound System</text>
    
    <text x="0" y="160" font-family="sans-serif" font-size="14" fill="#A39E93">Vinyl Packaging &bull; Ink Stippling &bull; Typography</text>
    <text x="0" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#666">CAT: #NT-2026-LP</text>
  </g>
</svg>
