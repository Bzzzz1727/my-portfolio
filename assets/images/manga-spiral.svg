<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" aria-label="Original surreal ink spiral motif" role="img">
  <defs>
    <!-- Screentone / Inking Pattern -->
    <pattern id="spiralHatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B51220" stroke-width="1" opacity="0.35"/>
    </pattern>
    <radialGradient id="spiralVignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#0A0A0A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(300, 300)" stroke="#F4F0E8" stroke-linecap="round" fill="none">
    <!-- Outer Inked Radiating Fracture Lines -->
    <g opacity="0.4" stroke-width="0.75">
      <line x1="0" y1="-280" x2="0" y2="-240" stroke="#B51220"/>
      <line x1="72" y1="-270" x2="62" y2="-230"/>
      <line x1="140" y1="-240" x2="120" y2="-200"/>
      <line x1="198" y1="-198" x2="170" y2="-170" stroke="#B51220"/>
      <line x1="240" y1="-140" x2="200" y2="-120"/>
      <line x1="270" y1="-72" x2="230" y2="-62"/>
      <line x1="280" y1="0" x2="240" y2="0"/>
      <line x1="270" y1="72" x2="230" y2="62" stroke="#B51220"/>
      <line x1="240" y1="140" x2="200" y2="120"/>
      <line x1="198" y1="198" x2="170" y2="170"/>
      <line x1="140" y1="240" x2="120" y2="200" stroke="#B51220"/>
      <line x1="72" y1="270" x2="62" y2="230"/>
      <line x1="0" y1="280" x2="0" y2="240"/>
      <line x1="-72" y1="270" x2="-62" y2="230" stroke="#B51220"/>
      <line x1="-140" y1="240" x2="-120" y2="200"/>
      <line x1="-198" y1="198" x2="-170" y2="170"/>
      <line x1="-240" y1="140" x2="-200" y2="120" stroke="#B51220"/>
      <line x1="-270" y1="72" x2="-230" y2="62"/>
      <line x1="-280" y1="0" x2="-240" y2="0"/>
      <line x1="-270" y1="-72" x2="-230" y2="-62" stroke="#B51220"/>
      <line x1="-240" y1="-140" x2="-200" y2="-120"/>
      <line x1="-198" y1="-198" x2="-170" y2="-170"/>
      <line x1="-140" y1="-240" x2="-120" y2="-200" stroke="#B51220"/>
      <line x1="-72" y1="-270" x2="-62" y2="-230"/>
    </g>

    <!-- Concentric Hypnotic Spiral Ribs with Variable Ink Weight -->
    <!-- Arm 1: Primary Swirl -->
    <path d="M0,0 
      C10,-5 20,-20 15,-35 
      C8,-55 -25,-60 -45,-45 
      C-75,-25 -80,20 -55,55 
      C-20,95 40,105 85,75 
      C140,35 150,-45 110,-105 
      C60,-175 -40,-190 -125,-140 
      C-225,-80 -245,45 -180,155 
      C-100,280 50,305 185,230" 
      stroke="#F4F0E8" stroke-width="3.5" fill="none"/>

    <!-- Arm 2: Counter Inked Ribbon with Blood Accents -->
    <path d="M-5,5 
      C-15,10 -30,5 -35,-10 
      C-42,-32 -20,-50 5,-52 
      C40,-55 70,-25 72,12 
      C75,60 30,100 -25,102 
      C-95,105 -150,45 -152,-30 
      C-155,-125 -75,-200 35,-205 
      C165,-210 260,-105 262,35 
      C265,195 135,315 -35,320" 
      stroke="#B51220" stroke-width="1.8" opacity="0.85" fill="none"/>

    <!-- Arm 3: Dense Cross-hatch Ink Fill Simulation -->
    <path d="M2,-2 
      C5,-15 18,-25 30,-18 
      C48,-8 52,18 38,35 
      C18,58 -22,62 -48,42 
      C-82,15 -88,-38 -60,-75 
      C-22,-125 45,-135 95,-95 
      C160,-45 175,40 125,115 
      C60,205 -50,225 -145,160 
      C-255,80 -275,-55 -195,-175" 
      stroke="#F4F0E8" stroke-width="1.2" stroke-dasharray="8 3" opacity="0.75" fill="none"/>

    <!-- Secondary Micro Hatch Swirl -->
    <path d="M-2,2 
      C-8,-5 -5,-15 5,-18 
      C20,-22 35,-8 32,10 
      C28,32 5,45 -18,40 
      C-48,32 -65,-2 -55,-35 
      C-42,-78 2,-100 45,-88 
      C100,-72 128,-10 110,48 
      C88,120 5,160 -70,135 
      C-160,105 -205,-5 -170,-95" 
      stroke="#888580" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.6"/>

    <!-- Dense Ink Core Vortex -->
    <circle cx="0" cy="0" r="16" fill="#0A0A0A" stroke="#B51220" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#F4F0E8"/>
    <circle cx="0" cy="0" r="3" fill="#0A0A0A"/>
  </g>
</svg>
