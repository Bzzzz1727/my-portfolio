<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ed"/>
      <stop offset="100%" stop-color="#eae6dc"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="452" rx="4" fill="none" stroke="#d8d4c7" stroke-width="1.5" stroke-dasharray="6 6"/>
  
  <!-- Editorial Grid & Typography Illustration -->
  <g transform="translate(100, 70)">
    <!-- Simulated Editorial Grid Sheets -->
    <rect x="0" y="0" width="260" height="340" rx="4" fill="#ffffff" stroke="#d5d0c2" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.06))"/>
    <rect x="24" y="24" width="80" height="12" fill="#121212"/>
    <rect x="24" y="46" width="212" height="6" fill="#8a867c"/>
    <rect x="24" y="58" width="180" height="6" fill="#8a867c"/>
    <rect x="24" y="70" width="140" height="6" fill="#8a867c"/>
    
    <rect x="24" y="96" width="212" height="130" fill="#f0ede4" stroke="#e0dbce" stroke-width="1"/>
    <!-- Abstract Logo Mark Inside Sheet -->
    <circle cx="130" cy="161" r="32" fill="none" stroke="#121212" stroke-width="3"/>
    <path d="M115 161 L145 161 M130 146 L130 176" stroke="#121212" stroke-width="3"/>
    
    <rect x="24" y="244" width="95" height="70" fill="#f8f7f3" stroke="#e4e0d4"/>
    <rect x="141" y="244" width="95" height="70" fill="#f8f7f3" stroke="#e4e0d4"/>
    <text x="71" y="284" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8a867c" text-anchor="middle">PANTONE</text>
    <text x="188" y="284" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8a867c" text-anchor="middle">TYPO/GRID</text>
  </g>

  <!-- Right Details -->
  <g transform="translate(420, 150)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#121212"/>
    <text x="60" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">GRAPHIC DESIGN</text>
    
    <text x="0" y="65" font-family="Georgia, serif" font-size="28" font-weight="500" fill="#121212">Visual Identity</text>
    <text x="0" y="95" font-family="Georgia, serif" font-size="28" font-weight="500" fill="#121212">&amp; Editorial System</text>
    
    <text x="0" y="135" font-family="sans-serif" font-size="14" fill="#5e5c56">Modular Grid &bull; Logotype &bull; Print Ready</text>
    <text x="0" y="165" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8a867c">Replace with: assets/images/project-graphic-design.jpg</text>
  </g>
</svg>
